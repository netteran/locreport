name: Digest Send
on:
  schedule:
    # Weekly digest — Fridays 1pm Central European time. It is the only
    # cadence; there is no daily digest.
    # GitHub Actions cron is UTC-only and ignores DST, so we schedule both
    # possible UTC offsets and let the job itself decide which one is live
    # by checking the actual Europe/Berlin clock (see "Check schedule").
    - cron: '0 11 * * 5' # 1pm CEST (UTC+2, roughly late Mar–late Oct)
    - cron: '0 12 * * 5' # 1pm CET (UTC+1, roughly late Oct–late Mar)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check schedule
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SCHEDULE="${{ github.event.schedule }}"
          # GitHub Actions can delay a scheduled run by hours under load, so
          # matching on the exact target hour is unreliable — a late-firing
          # run would see the wrong local hour and skip every time. Match on
          # which DST offset is currently active instead: that only flips
          # twice a year, so a delayed run still resolves correctly.
          CURRENT_OFFSET="$(TZ='Europe/Berlin' date +%z)"

          case "$SCHEDULE" in
            "0 11 * * 5") EXPECTED_OFFSET="+0200" ;;
            "0 12 * * 5") EXPECTED_OFFSET="+0100" ;;
            *)
              echo "Unrecognized schedule: $SCHEDULE" >&2
              exit 1
              ;;
          esac

          if [ "$CURRENT_OFFSET" = "$EXPECTED_OFFSET" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send digest
        if: steps.guard.outputs.proceed == 'true'
        run: |
          curl -f --max-time 300 -X POST "https://locreport.com/api/digest/send" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
